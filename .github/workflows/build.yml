name: Gerar executáveis

# Gera o FileLife para PC (Windows e Mac) sempre que o programa muda.
# O resultado fica para baixar em Actions → (execução) → Artifacts.
# Criar uma tag vX.Y.Z publica também em Releases.
on:
  push:
    branches: [main]
    paths: ["filelife_desktop.py", "filelifecycle.py", ".github/workflows/build.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ";"
            artifact: FileLife-Windows
          - os: macos-latest
            sep: ":"
            artifact: FileLife-Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller google-api-python-client google-auth-oauthlib send2trash pystray pillow

      - name: Testar se o código carrega
        run: python -c "import filelifecycle, filelife_desktop"

      # Opcional: credenciais do Google ("App para computador") guardadas como segredo do
      # repositório (Settings → Secrets → Actions → GOOGLE_CLIENT_JSON). Com elas, quem
      # instalar o FileLife só precisa clicar em "Conectar Google Drive".
      - name: Incluir credenciais do Google (se configuradas)
        shell: bash
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then
            printf '%s' "$GOOGLE_CLIENT_JSON" > google_client.json
            echo "EXTRA_DATA=--add-data google_client.json${{ matrix.sep }}." >> "$GITHUB_ENV"
          fi

      - name: Gerar executável
        shell: bash
        run: >
          pyinstaller --onefile --windowed --name FileLife
          --collect-data googleapiclient
          --hidden-import send2trash --hidden-import pystray --hidden-import PIL.ImageDraw
          $EXTRA_DATA
          filelife_desktop.py

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/FileLife.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Empacotar (Mac)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent FileLife.app ../${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: "*.zip"
          body: |
            **Windows:** baixe `FileLife-Windows.zip`, extraia e abra o `FileLife.exe`.
            **Mac:** baixe `FileLife-Mac.zip`, extraia e abra o `FileLife.app` (na 1ª vez: botão direito → Abrir).
